<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Clarify</title>
    <link rel="icon" href="images/ClarifyLogo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/ClarifyLogo.png" alt="" height="24">
                <span>Clarify</span>
            </a>

            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="guidelines.html" class="nav-link">Guidelines</a></li>
                <li class="nav-item"><a href="checklist.html" class="nav-link">Checklist</a></li>
                <li class="nav-item"><a href="quiz.html" class="nav-link">Quiz</a></li>
                <li class="nav-item"><a href="prompt.html" class="nav-link">Prompt-helper</a></li>
                <li class="nav-highlight"></li>
            </ul>

            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <a href="login.html" class="nav-cta hidden">Get Started</a>
        </div>
        
        <!-- Mobile menu dropdown -->
        <div class="mobile-menu">
            <a href="index.html" class="mobile-menu-link">Home</a>
            <a href="guidelines.html" class="mobile-menu-link">Guidelines</a>
            <a href="checklist.html" class="mobile-menu-link">Checklist</a>
            <a href="quiz.html" class="mobile-menu-link">Quiz</a>
            <a href="prompt.html" class="mobile-menu-link">Prompt-helper</a>
            <a href="login.html" class="mobile-menu-link mobile-menu-cta">Get Started</a>
        </div>
    </nav>

    <!-- Reset Password Section -->
    <section class="hero hero-locked" aria-labelledby="hero-heading-forgot-password">
        <div class="hero-glow"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="hero-heading-forgot-password">Reset Password</h1>

            <!-- Step 1: Enter username -->
            <div id="step1" class="reset-step">
                <form class="login-form" id="usernameForm">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>
                    <button type="submit" class="form-submit">Continue</button>
                    
                    <!-- Error message display -->
                    <div id="step1ErrorMessage" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; color: #ff6b6b; text-align: center;"></div>
                    
                    <div class="form-footer">
                        <p>Remember your password? <a href="login.html">Sign in here</a></p>
                    </div>
                </form>
            </div>

            <!-- Step 2: Answer security question -->
            <div id="step2" class="reset-step" style="display: none;">
                <form class="login-form" id="resetForm">
                    <div class="form-group">
                        <label class="form-label">Security Question</label>
                        <p id="securityQuestion" style="color: var(--text-secondary); margin-bottom: 20px;"></p>
                    </div>

                    <div class="form-group">
                        <label for="securityAnswer" class="form-label">Your Answer</label>
                        <input 
                            type="text" 
                            id="securityAnswer" 
                            name="securityAnswer" 
                            class="form-input" 
                            placeholder="Enter your answer"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                        <input 
                            type="password" 
                            id="confirmNewPassword" 
                            name="confirmNewPassword" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                        <small id="passwordMatch" style="display: none; margin-top: 8px; font-size: 0.875rem;"></small>
                    </div>

                    <button type="submit" class="form-submit">Reset Password</button>
                    
                    <!-- Error message display -->
                    <div id="step2ErrorMessage" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; color: #ff6b6b; text-align: center;"></div>
                    
                    <!-- Success message display -->
                    <div id="step2SuccessMessage" style="display: none; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; color: #4ade80; text-align: center;"></div>
                    
                    <div class="form-footer">
                        <p><a href="#" id="backLink">← Back to username</a></p>
                    </div>
                </form>
            </div>

        </div>
    </section>
    
    <script src="JS/auth-helper.js"></script>
    <script src="JS/main.js"></script>
    <script>
        // Auto-detect API URL based on environment
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000/api'
            : '/api';
        
        console.log('Using API URL:', API_BASE_URL);
        
        let currentUsername = '';
        const securityQuestions = {
            'pet': 'What was the name of your first pet?',
            'city': 'In which city were you born?',
            'school': 'What is the name of your elementary school?',
            'teacher': 'What was your favorite teacher\'s name?',
            'food': 'What is your favorite food?'
        };

        // Helper function to show error message
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        // Helper function to show success message
        function showSuccess(elementId, message) {
            const successElement = document.getElementById(elementId);
            successElement.textContent = message;
            successElement.style.display = 'block';
        }

        // Live password matching validation
        const passwordField = document.getElementById('newPassword');
        const confirmPasswordField = document.getElementById('confirmNewPassword');
        const passwordMatchMessage = document.getElementById('passwordMatch');

        const checkPasswordMatch = () => {
            const password = passwordField.value;
            const confirmPassword = confirmPasswordField.value;

            // Only show message if user has started typing in confirm field
            if (confirmPassword.length > 0) {
                passwordMatchMessage.style.display = 'block';
                
                if (password === confirmPassword) {
                    passwordMatchMessage.textContent = '✓ Passwords match';
                    passwordMatchMessage.style.color = '#10b981'; // green
                } else {
                    passwordMatchMessage.textContent = '✗ Passwords do not match';
                    passwordMatchMessage.style.color = '#ef4444'; // red
                }
            } else {
                passwordMatchMessage.style.display = 'none';
            }
        };

        // Add event listeners for live validation
        if (passwordField && confirmPasswordField && passwordMatchMessage) {
            passwordField.addEventListener('input', checkPasswordMatch);
            confirmPasswordField.addEventListener('input', checkPasswordMatch);
        }

        // Step 1: Get security question
        document.getElementById('usernameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            
            // Hide any previous error messages
            document.getElementById('step1ErrorMessage').style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE_URL}/get-security-question`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUsername = username;
                    document.getElementById('securityQuestion').textContent = 
                        securityQuestions[data.securityQuestion] || data.securityQuestion;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    showError('step1ErrorMessage', data.error || 'User not found');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('step1ErrorMessage', 'An error occurred. Please try again.');
            }
        });

        // Step 2: Reset password
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide any previous messages
            document.getElementById('step2ErrorMessage').style.display = 'none';
            document.getElementById('step2SuccessMessage').style.display = 'none';
            
            const securityAnswer = document.getElementById('securityAnswer').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                showError('step2ErrorMessage', 'Passwords do not match');
                return;
            }

            if (newPassword.length < 6) {
                showError('step2ErrorMessage', 'Password must be at least 6 characters');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUsername,
                        securityAnswer,
                        newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('step2SuccessMessage', 'Password reset successfully! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showError('step2ErrorMessage', data.error || 'Incorrect security answer');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('step2ErrorMessage', 'An error occurred. Please try again.');
            }
        });

        // Back button
        document.getElementById('backLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('username').value = '';
            // Clear all error messages
            document.getElementById('step1ErrorMessage').style.display = 'none';
            document.getElementById('step2ErrorMessage').style.display = 'none';
            document.getElementById('step2SuccessMessage').style.display = 'none';
        });
    </script>
</body>
</html>

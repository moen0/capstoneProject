<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Clarify</title>
    <link rel="icon" href="images/ClarifyLogo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/ClarifyLogo.png" alt="" height="24">
                <span>Clarify</span>
            </a>

            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="guidelines.html" class="nav-link">Guidelines</a></li>
                <li class="nav-item"><a href="checklist.html" class="nav-link">Checklist</a></li>
                <li class="nav-item"><a href="quiz.html" class="nav-link">Quiz</a></li>
                <li class="nav-item"><a href="prompt.html" class="nav-link">Prompt-helper</a></li>
                <li class="nav-highlight"></li>
            </ul>

            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <a href="login.html" class="nav-cta">Get Started</a>
        </div>
        
        <!-- Mobile menu dropdown -->
        <div class="mobile-menu">
            <a href="index.html" class="mobile-menu-link">Home</a>
            <a href="guidelines.html" class="mobile-menu-link">Guidelines</a>
            <a href="checklist.html" class="mobile-menu-link">Checklist</a>
            <a href="quiz.html" class="mobile-menu-link">Quiz</a>
            <a href="prompt.html" class="mobile-menu-link">Prompt-helper</a>
            <a href="login.html" class="mobile-menu-link mobile-menu-cta">Get Started</a>
        </div>
    </nav>

    <!-- Reset Password Section -->
    <section class="hero hero-locked">
        <div class="hero-glow"></div>
        <div class="hero-content">
            <h1 class="hero-title">Reset Password</h1>
            
            <!-- Step 1: Enter username -->
            <div id="step1" class="reset-step">
                <form class="login-form" id="usernameForm">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>
                    <button type="submit" class="form-submit">Continue</button>
                    <div class="form-footer">
                        <p>Remember your password? <a href="login.html">Sign in here</a></p>
                    </div>
                </form>
            </div>

            <!-- Step 2: Answer security question -->
            <div id="step2" class="reset-step" style="display: none;">
                <form class="login-form" id="resetForm">
                    <div class="form-group">
                        <label class="form-label">Security Question</label>
                        <p id="securityQuestion" style="color: rgba(255, 255, 255, 0.7); margin-bottom: 20px;"></p>
                    </div>

                    <div class="form-group">
                        <label for="securityAnswer" class="form-label">Your Answer</label>
                        <input 
                            type="text" 
                            id="securityAnswer" 
                            name="securityAnswer" 
                            class="form-input" 
                            placeholder="Enter your answer"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                        <input 
                            type="password" 
                            id="confirmNewPassword" 
                            name="confirmNewPassword" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <button type="submit" class="form-submit">Reset Password</button>
                    <div class="form-footer">
                        <p><a href="#" id="backLink">← Back to username</a></p>
                    </div>
                </form>
            </div>

        </div>
    </section>
    
    <script src="JS/auth-helper.js"></script>
    <script src="JS/main.js"></script>
    <script>
        const API_BASE_URL = 'https://capstone-project-sinsan.vercel.app/api';
        let currentUsername = '';
        const securityQuestions = {
            'pet': 'What was the name of your first pet?',
            'city': 'In which city were you born?',
            'school': 'What is the name of your elementary school?',
            'teacher': 'What was your favorite teacher\'s name?',
            'food': 'What is your favorite food?'
        };

        // Step 1: Get security question
        document.getElementById('usernameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/get-security-question`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUsername = username;
                    document.getElementById('securityQuestion').textContent = 
                        securityQuestions[data.securityQuestion] || data.securityQuestion;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    alert(data.error || 'Bruker ikke funnet');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('En feil oppstod');
            }
        });

        // Step 2: Reset password
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const securityAnswer = document.getElementById('securityAnswer').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                alert('Passordene matcher ikke');
                return;
            }

            if (newPassword.length < 6) {
                alert('Passordet må være minst 6 tegn');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUsername,
                        securityAnswer,
                        newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Passord tilbakestilt! Du kan nå logge inn med ditt nye passord.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Feil svar på sikkerhetsspørsmål');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('En feil oppstod');
            }
        });

        // Back button
        document.getElementById('backLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('username').value = '';
        });
    </script>
</body>
</html>

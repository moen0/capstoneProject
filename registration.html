    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar seksjon -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/ClarifyLogo.png" alt="" height="24">
                <span>Clarify</span>
            </a>

            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="guidelines.html" class="nav-link">Guidelines</a></li>
                <li class="nav-item"><a href="checklist.html" class="nav-link">Checklist</a></li>
                <li class="nav-item"><a href="quiz.html" class="nav-link">Quiz</a></li>
                <li class="nav-item"><a href="prompt.html" class="nav-link">Prompt-helper</a></li>
                <li class="nav-highlight"></li>
            </ul>

            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <a href="login.html" class="nav-cta" id="navGetStarted">Get Started</a>
            
            <div class="user-dropdown hidden" id="userDropdown">
                <button class="user-button" id="userButton">
                    <span class="user-avatar" id="userAvatar">U</span>
                    <span id="userName">User</span>
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="profile.html" class="dropdown-item">
                        <span class="dropdown-icon"><i class="fa fa-user"></i></span>
                        Profile
                    </a>
                    <a href="#" class="dropdown-item logout" id="logoutBtn">
                        <span class="dropdown-icon"><i class="fa fa-sign-out"></i></span>
                        Logout
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Mobile menu dropdown -->
        <div class="mobile-menu">
            <a href="index.html" class="mobile-menu-link">Home</a>
            <a href="guidelines.html" class="mobile-menu-link">Guidelines</a>
            <a href="checklist.html" class="mobile-menu-link">Checklist</a>
            <a href="quiz.html" class="mobile-menu-link">Quiz</a>
            <a href="prompt.html" class="mobile-menu-link">Prompt-helper</a>
            <div class="mobile-user-info" id="mobileUserInfo" style="display: none;">
                <a href="profile.html" class="mobile-menu-link"><i class="fa fa-user"></i> Profile</a>

            <a href="login.html" class="mobile-menu-link mobile-menu-cta" id="mobileGetStarted">Get Started</a>
        </div>
    </nav>

    <!--Registration seksjon-->
   <section class="hero hero-scrollable" aria-labelledby="hero-heading-registration">
        <div class="hero-glow"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="hero-heading-registration">Sign Up</h1>

            <form class="registration-form" id="registrationForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="johndoe"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                    <small id="passwordMatch" style="display: none; margin-top: 8px; font-size: 0.875rem;"></small>
                </div>

                <div class="form-group">
                    <label for="securityQuestion" class="form-label">Security Question</label>
                    <select 
                        id="securityQuestion" 
                        name="securityQuestion" 
                        class="form-input" 
                        required
                    >
                        <option value="">Select a security question</option>
                        <option value="pet">What was the name of your first pet?</option>
                        <option value="city">In which city were you born?</option>
                        <option value="school">What is the name of your elementary school?</option>
                        <option value="teacher">What was your favorite teacher's name?</option>
                        <option value="food">What is your favorite food?</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="securityAnswer" class="form-label">Security Answer</label>
                    <input 
                        type="text" 
                        id="securityAnswer" 
                        name="securityAnswer" 
                        class="form-input" 
                        placeholder="Your answer"
                        required
                    >
                </div>

                <button type="submit" class="form-submit">Create Account</button>

                <div class="form-footer">
                    <p>Already have an account? <a href="login.html">Sign in here</a></p>
                </div>

                <!-- Error message display -->
                <div id="errorMessage" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; color: #ff6b6b; text-align: center;"></div>
            </form>
        </div>
    </section>
    
    <script src="JS/auth-helper.js"></script>
    <script src="JS/main.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
